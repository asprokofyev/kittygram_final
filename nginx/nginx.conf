server {
  listen 80;
  index index.html;

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:9000/api/;
  }

  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:9000/admin/;
  }

  location /static/ {
    alias /staticfiles/static/;
  }

  location /media/ {
    alias /app/media/;
  }

  location / {
    root /staticfiles;
    try_files $uri /index.html;
  }
}
